name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fioner
          POSTGRES_PASSWORD: fioner
          POSTGRES_DB: fioner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U fioner"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://fioner:fioner@localhost:5432/fioner_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-for-zod
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-for-zod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Migrate
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build
